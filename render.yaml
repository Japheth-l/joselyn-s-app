# Render Blueprint: the website and its PostgreSQL database.
# In Render: New + > Blueprint > pick this repository. The web service keeps its first name, "tailorconnect",
# so its public URL stays the same; renaming it would make Render create a new service with a new URL.
#
# V2 starts on its own new, empty, paid database (ntoma-db). The V1 database "tailorconnect-db" is no longer in
# this file: Render does not delete resources removed from a Blueprint, so it stays untouched for a rollback until
# you delete it yourself. scripts/migrate.mjs refuses to start against a V1 database (see docs/DEPLOYMENT.md).
databases:
  - name: ntoma-db
    # Paid: point-in-time recovery and no 30-day expiry (the free plan has neither).
    plan: basic-256mb
    diskSizeGB: 1
    # name, databaseName, user, region and postgresMajorVersion cannot be changed after creation.
    databaseName: ntoma
    user: ntoma
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: tailorconnect
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run deploy:build
    # Applies pending migrations (never resets data), then starts the app.
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ntoma-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # The one administrator created on first start (only into an empty database). Both are required: the
      # deploy fails rather than start without them. Set ADMIN_EMAIL to a mailbox you read; the password is
      # generated by Render (Environment tab). Changing either later does not change the existing account.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # "sandbox" = clearly-labelled test payments, no real money. Remove it (and set PAYSTACK_SECRET_KEY)
      # to take real payments.
      - key: PAYMENTS_MODE
        value: sandbox
      # Into an EMPTY database only: the style catalogue and the administrator above. Never demo data.
      - key: SEED_ON_EMPTY
        value: catalogue-and-admin
      - key: SMS_SENDER_ID
        value: Ntoma
      # Uploaded photos and documents. Unset (or "local") keeps them on the instance disk, which Render wipes on
      # every deploy and restart. Set "s3" in the dashboard, with the S3_* variables below, once the bucket has
      # passed `npm run storage:check` (docs/DEPLOYMENT.md). Not set here so a Blueprint sync never overrides it.
      - key: STORAGE_DRIVER
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      # Protects /api/cron. Call it every 15 minutes (see docs/DEPLOYMENT.md).
      - key: CRON_SECRET
        generateValue: true
      # Fill these in under Environment when you have the accounts.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
