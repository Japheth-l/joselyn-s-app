# Render Blueprint: the website and its PostgreSQL database.
# In Render: New + > Blueprint > pick this repository. The service and database names below are kept
# from the first deployment; renaming them would make Render create new ones.
databases:
  - name: tailorconnect-db
    plan: free
    databaseName: tailorconnect
    user: tailorconnect
    region: frankfurt

services:
  - type: web
    name: tailorconnect
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run deploy:build
    # Applies pending migrations (never resets data), then starts the app.
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tailorconnect-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Administrator created by the seed (only into an empty database).
      - key: ADMIN_PASSWORD
        generateValue: true
      # "sandbox" = clearly-labelled test payments, no real money. Remove it (and set PAYSTACK_SECRET_KEY)
      # to take real payments.
      - key: PAYMENTS_MODE
        value: sandbox
      # Load the catalogue and clearly-marked demo businesses into an EMPTY database on first start.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SMS_SENDER_ID
        value: Ntoma
      # Uploaded photos. "local" is lost on every redeploy on Render's free plan; use "s3" with a bucket
      # (Cloudflare R2, AWS S3, Backblaze B2) for anything real.
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOAD_DIR
        value: ./uploads
      # Protects /api/cron. Call it every 15 minutes (see docs/DEPLOYMENT.md).
      - key: CRON_SECRET
        generateValue: true
      # Fill these in under Environment when you have the accounts.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
