# Render Blueprint: creates the Ntoma website and its PostgreSQL database.
# In Render: New + > Blueprint > pick this repository (or use the Deploy button in the README).
databases:
  - name: tailorconnect-db
    plan: free
    databaseName: tailorconnect
    user: tailorconnect
    region: frankfurt

services:
  - type: web
    name: tailorconnect
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run deploy:build
    startCommand: npm run deploy:start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tailorconnect-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SMS_SENDER_ID
        value: Ntoma
      - key: UPLOAD_DIR
        value: ./uploads
      # Leave these empty to run payments and SMS in demo mode. Add them later under Environment.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
